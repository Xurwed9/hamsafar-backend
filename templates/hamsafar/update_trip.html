{% extends "accounts/base.html" %}
{% block main %}

<h3>Edit Trip</h3>
<form method="post">
    {% csrf_token %}
    
    <label>Car:</label><br>
    <select name="car_id" required style="width: 100%; padding: 8px;">
        {% for car in user_cars %}
            <option value="{{ car.id }}" {% if car.id == trip.car.id %}selected{% endif %}>
                {{ car.car_name }} ({{ car.car_number }})
            </option>
        {% endfor %}
    </select><br><br>

    <label>From:</label><br>
    <input type="text" name="from_city" value="{{ trip.from_city }}" required><br><br>

    <label>To:</label><br>
    <input type="text" name="to_city" value="{{ trip.to_city }}" required><br><br>

    <label>Departure Time:</label><br>
    <input type="datetime-local" name="departure_time" value="{{ trip.departure_time|date:'Y-m-d\TH:i' }}" required><br><br>

    <label>Price:</label><br>
    <input type="number" name="price" value="{{ trip.price }}" required><br><br>

    <label>Free Seats:</label><br>
    <input type="number" name="free_seats" value="{{ trip.free_seats }}" required><br><br>

    <button type="submit">Save Changes</button>
    <a href="{% url 'trip_list' %}">Cancel</a>
</form>

{% endblock %}
