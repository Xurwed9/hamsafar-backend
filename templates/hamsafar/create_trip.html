{% extends "accounts/base.html" %}
{% block main %}

{% if not user_cars %}
    <h3>Step 1: Add your car first</h3>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="add_car" value="1">
        <label>Car Name:</label><br>
        <input type="text" name="car_name" placeholder="Toyota Camry" required><br><br>
        
        <label>Car Number:</label><br>
        <input type="text" name="car_number" placeholder="0001TJ01" required><br><br>
        
        <label>Total Seats:</label><br>
        <input type="number" name="seats" required><br><br>
        
        <button type="submit">Save Car & Continue</button>
    </form>
{% else %}
    <h3>Step 2: Create a Trip</h3>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="create_trip" value="1">
        
        <label>Select Car:</label><br>
        <select name="car_id" required style="width: 100%; padding: 8px;">
            {% for car in user_cars %}
                <option value="{{ car.id }}">{{ car.car_name }} ({{ car.car_number }})</option>
            {% endfor %}
        </select><br><br>

        <label>From:</label><br>
        <input type="text" name="from_city" required><br><br>

        <label>To:</label><br>
        <input type="text" name="to_city" required><br><br>

        <label>Departure Time:</label><br>
        <input type="datetime-local" name="departure_time" required><br><br>

        <label>Price:</label><br>
        <input type="number" name="price" required><br><br>

        <label>Free Seats:</label><br>
        <input type="number" name="free_seats" required><br><br>

        <button type="submit">Create Trip</button>
    </form>
{% endif %}

{% endblock %}
