 {% extends "accounts/base.html" %}

{% block main %}
<h2>Сафари нав созед (Бо иловаи мошин)</h2>

<form method="POST">
    {% csrf_token %}

    <h3>🚗 Маълумоти мошин:</h3>
    <p>
        <label>Номи мошин:</label><br>
        <input type="text" name="car_name" placeholder="Масалан: Opel Astra" required>
    </p>

    <p>
        <label>Рақами давлатии мошин:</label><br>
        <input type="text" name="car_number" placeholder="Масалан: 7777TJ01" required>
    </p>

    <p>
        <label>Шумораи умумии ҷойҳо дар мошин:</label><br>
        <input type="number" name="seats" placeholder="Масалан: 4" required>
    </p>

    <hr> <h3>🗺️ Маълумоти сафар:</h3>
    <p>
        <label>Аз кадом шаҳр:</label><br>
        <input type="text" name="from_city" placeholder="Масалан: Душанбе" required>
    </p>

    <p>
        <label>Ба кадом шаҳр:</label><br>
        <input type="text" name="to_city" placeholder="Масалан: Хуҷанд" required>
    </p>

    <p>
        <label>Вақти ҳаракат:</label><br>
        <input type="datetime-local" name="departure_time" required>
    </p>

    <p>
        <label>Нархи як ҷой (сомонӣ):</label><br>
        <input type="number" step="0.01" name="price" placeholder="Масалан: 120" required>
    </p>

    <p>
        <label>Ҷойҳои холӣ барои мусофирон:</label><br>
        <input type="number" name="free_seats" placeholder="Масалан: 3" required>
    </p>

    <button type="submit" style="padding: 10px 20px; background-color: green; color: white; border: none; cursor: pointer;">
        Сафарро эълон кун
    </button>
</form>

<br>
<a href="{% url 'trip_list' %}">Бозгашт ба саҳифаи асосӣ</a>
{% endblock  %}
