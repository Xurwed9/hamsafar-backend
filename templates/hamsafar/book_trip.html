{% extends 'accounts/base.html' %}

{% block main %}

<h2>Book Trip</h2>

<p>
    {{ trip.from_city }} ➜ {{ trip.to_city }}
</p>

<p>
    Available seats: {{ trip.free_seats }}
</p>

{% if error %}
    <p style="color:red">{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label>How many seats?</label>

    <input type="number"
           name="seats"
           min="1"
           max="{{ trip.free_seats }}"
           value="1">

    <button type="submit">
        Confirm Booking
    </button>

</form>

{% endblock %}
