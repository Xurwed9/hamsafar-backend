{% extends 'accounts/base.html' %}

{% block main %}

<style>
.booking-container{
    min-height:70vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.booking-card{
    width:100%;
    max-width:500px;
    background:#fff;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,0.12);
    text-align:center;
}

.booking-card h2{
    margin-bottom:25px;
    color:#1f2937;
    font-size:32px;
}

.trip-details{
    background:#f8fafc;
    padding:18px;
    border-radius:12px;
    margin-bottom:25px;
}

.trip-details p{
    margin:10px 0;
    color:#374151;
    font-size:17px;
}

.booking-card label{
    display:block;
    text-align:left;
    margin-bottom:10px;
    font-weight:600;
    color:#374151;
}

.booking-card input{
    width:100%;
    padding:14px;
    border:2px solid #e5e7eb;
    border-radius:12px;
    font-size:16px;
    margin-bottom:20px;
    transition:0.3s;
}

.booking-card input:focus{
    outline:none;
    border-color:#3b82f6;
    box-shadow:0 0 0 4px rgba(59,130,246,0.15);
}

.booking-card button{
    width:100%;
    border:none;
    padding:15px;
    border-radius:12px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.booking-card button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(37,99,235,0.35);
}

.error-box{
    background:#fee2e2;
    color:#dc2626;
    padding:12px;
    border-radius:10px;
    margin-bottom:20px;
    font-weight:600;
}
</style>

<div class="booking-container">

    <div class="booking-card">

        <h2>🚗 Book Trip</h2>

        <div class="trip-details">
            <p><strong>Route:</strong> {{ trip.from_city }} ➜ {{ trip.to_city }}</p>
            <p><strong>Available Seats:</strong> {{ trip.free_seats }}</p>
        </div>

        {% if error %}
            <div class="error-box">
                {{ error }}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="seats">How many seats?</label>

            <input type="number"
                   id="seats"
                   name="seats"
                   min="1"
                   max="{{ trip.free_seats }}"
                   value="1">

            <button type="submit">
                Confirm Booking
            </button>
        </form>

    </div>

</div>

{% endblock %}
