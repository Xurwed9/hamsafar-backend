<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamsafar</title>
</head>
<body>
    <header>
        <nav>
            {% if request.user.is_authenticated %}
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'register' %}">Register</a>
                <a href="{% url 'login' %}">Login</a>
            {% endif %} </nav>
    </header>

    <main>
        {% block main %}
            <h2>Block Main</h2>
        {% endblock %}
    </main>

    <footer>
        <h1>Footer</h1>
    </footer>
</body>
</html>
