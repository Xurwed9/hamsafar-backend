{% extends "accounts/base.html" %}

{% block main %}

<div class="auth-container">

    <h3 class="auth-title">Register</h3>

    <form action="" method="post" class="auth-form">
        {% csrf_token %}

        <label class="auth-label">Username</label>
        <input type="text" name="username" placeholder="Enter your username" class="auth-input" required>

        <label class="auth-label">Email</label>
        <input type="email" name="email" placeholder="Enter your email" class="auth-input" required>

        <label class="auth-label">Password</label>
        <input type="password" name="password1" placeholder="Enter your password" class="auth-input" required>

        <label class="auth-label">Confirm Password</label>
        <input type="password" name="password2" placeholder="Confirm password" class="auth-input" required>

        <label class="auth-label">Phone Number</label>
        <input type="text" name="phone" placeholder="Enter your phone" class="auth-input" required>

        <label class="auth-label">Age</label>
        <input type="number" name="age" placeholder="Enter your age" class="auth-input" required>

        <label class="auth-label">Who are you?</label>
        <select name="role" class="auth-input" required>
            <option value="passenger">🙋‍♂️ Passenger</option>
            <option value="driver">🚗 Driver</option>
        </select>

        <button type="submit" class="auth-button">
            Register
        </button>

        {% if error %}
            <p class="auth-error">{{ error }}</p>
        {% endif %}
    </form>

</div>

{% endblock %}
