{% extends "accounts/base.html" %}

{% block main %}

<div class="auth-container">

    <h3 class="auth-title">Confirm Email</h3>

    <form action="{% url 'confirm' %}" method="post" class="auth-form">
        {% csrf_token %}

        <label class="auth-label">Username</label>
        <input
            value="{{ username }}"
            type="text"
            name="username"
            placeholder="Enter your username"
            class="auth-input"
            required
        >

        <label class="auth-label">Code</label>
        <input
            type="text"
            name="code"
            placeholder="Enter 6-digit code"
            class="auth-input"
            required
        >

        <button type="submit" class="auth-button">
            Confirm
        </button>

        {% if error %}
            <p class="auth-error">{{ error }}</p>
        {% endif %}
    </form>

    <div class="auth-footer">
        <p>
            Already have an account?
            <a href="{% url 'login' %}" class="auth-link">Sign in</a>
        </p>
    </div>

</div>

{% endblock %}
